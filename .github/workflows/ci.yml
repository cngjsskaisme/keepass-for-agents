name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ['22.18', '24']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        # KPScript-dependent tests skip automatically — KeePass/KPScript
        # binaries are GPL and are never installed or committed in CI.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python helper deps + lint (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt ruff
          .venv/bin/ruff check --select E4,E7,E9,F src/keepass

      - name: Python helper deps (Windows — wheel availability check)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements.txt
